<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01","tnum";color:var(--navy);background:#d9e1eb;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

.body{flex:1;display:flex;min-height:0}

html,body{overflow:auto}
.win{min-width:1120px;min-height:720px}
button{font:inherit;color:inherit;cursor:pointer}
.btn,.item,.chip,.newbtn,.opt,.seg span,.send,.taskchip,.toast a,.link{cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s,color .12s,transform .12s}
.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}
.btn.pri:hover{background:#D63A31}.btn.navy:hover{background:#0A2242}
.btn.ghost:hover{background:var(--soft);color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.item:hover{background:#F3F6FA}.item.on:hover{background:var(--soft)}
.item.dim:hover{background:transparent}
.newbtn:hover{background:#D63A31}
.chip:hover{border-color:#b9c5d4;background:#FAFCFE}
.send{border:0}.send:hover{background:#D63A31}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
.titlebar .mock{display:flex;gap:10px;align-items:center;border:0;padding:0}
.titlebar .mock span{border:1px dashed #c5cfdb;border-radius:6px;padding:1px 7px}
.link{color:var(--blue);font-weight:600;background:none;border:0;padding:0;font-size:inherit}
.link:hover{text-decoration:underline}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .26s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}
.si.run{animation:spin .9s linear infinite}
.si{transition:background .3s,border-color .3s}
.st .tx b,.st .tx .d{transition:color .3s}
.st.run{background:linear-gradient(90deg,rgba(30,136,229,.05),transparent 70%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}
.si.skip{background:var(--soft);color:#8a95a5}.si.wait{background:#FFF4DC;color:var(--amber)}.si.stopped{background:var(--soft);color:var(--gray)}
.tag.skip,.tag.stopped{background:var(--soft);color:var(--gray)}.tag.wait{background:#FFF4DC;color:#8A5A00}
.bigbar i{transition:width .45s ease}
.prog i{transition:width .45s ease}
.dot.stop{background:#8a95a5}

.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:7px;height:7px;border-radius:50%;background:#b8c4d3;animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:none;opacity:.6}30%{transform:translateY(-4px);opacity:1}}

@keyframes blink{50%{opacity:0}}
.taskchip:hover{filter:brightness(.97)}
.taskchip.wait{background:#FFF4DC;color:#7A5200}.taskchip.stopped{background:var(--soft);color:var(--gray)}.taskchip.done{background:#E7F5EE;color:#145C40}

.empty{text-align:center;padding:90px 0 0}

.warnbox{display:flex;gap:10px;align-items:center;background:#FFF8E8;color:#6B4A00;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:10px}
.tw{grid-template-columns:1fr 320px}
.tcard{overflow:hidden}
.rp{min-height:0}
.logp{flex:1;min-height:0;display:flex;flex-direction:column}

.log li:first-child{border-top:0}
.log time{color:#9aa5b4;flex:none;white-space:nowrap;min-width:72px}
.log li.you{color:var(--navy);font-weight:600}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.now .pg i{background:linear-gradient(90deg,#e8eef5 0,#f4f7fa 50%,#e8eef5 100%);background-size:400px 100%;animation:shimmer 1.4s linear infinite}
.now .pg i.hl{background:#FFE7A8;animation:none}
.now.idle .pg i{animation:none}
.waitbar{display:flex;gap:10px;align-items:center;background:#FFF4DC;color:#6B4A00;border-radius:12px;padding:10px 14px;font-size:13px;margin-top:14px}
.stopbar{display:flex;gap:10px;align-items:center;background:var(--soft);color:var(--ink2);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:14px}
.scrim{z-index:50;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.dlg{position:relative;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
.f label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
.f input{appearance:none;width:16px;height:16px;border-radius:4px;border:2px solid #b9c5d4;margin:0;flex:none;display:grid;place-content:center;cursor:pointer;transition:all .12s}
.f input:checked{background:var(--navy);border-color:var(--navy)}
.f input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.f.off span.n{color:#9aa5b4;text-decoration:line-through}
.dlg textarea{width:calc(100% - 48px);margin:10px 24px 0;border:1px solid #cfd8e3;border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;min-height:80px;resize:vertical;color:var(--navy)}
.dlg textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,43,82,.08)}
.dclose{position:absolute;right:14px;top:14px;border:0;background:none;color:#9aa5b4;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dclose:hover{background:var(--soft);color:var(--navy)}
.nosel{font-size:12px;color:var(--red);margin:8px 24px 0}
.toasts{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(13,43,82,.3);display:flex;gap:12px;align-items:center;animation:toastin .25s ease-out;white-space:nowrap}
.toast a{color:#9fd0ff;font-weight:600}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
.opt{cursor:pointer}.opt:hover:not(.sel){box-shadow:0 0 0 1px #b9c5d4,0 4px 14px rgba(13,43,82,.06)}
.seg span:hover:not(.on){background:var(--soft)}
.inp{padding:0 12px}.inp input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink2);padding:9px 0;letter-spacing:.02em;min-width:0}
.inp:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,43,82,.08)}
.inp .show{cursor:pointer;background:none;border:0}
.err{color:var(--red);font-size:12.5px;margin-top:8px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
.spinner.dark{border-color:#cfe0f5;border-top-color:var(--blue)}
.folder{width:620px;padding:26px}
.path{display:flex;align-items:center;gap:12px;border:1px solid #cfd8e3;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;margin:16px 0 8px;background:#fff}
.path .ico{width:22px;height:22px;color:var(--blue)}
.back{position:absolute;left:24px;top:20px}
.sc{overflow-y:auto;padding-bottom:30px}
.sc .card{scroll-margin:20px;transition:box-shadow .4s}
.sc .card.flash{box-shadow:0 0 0 2px var(--blue),0 6px 20px rgba(30,136,229,.15)}
.toggle{border:0;cursor:pointer;transition:background .2s;padding:0}.toggle::after{transition:all .2s}
.toggle.offt{background:#c5cfdb}.toggle.offt::after{right:16px}
select{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;color:var(--navy);cursor:pointer}
.addkey{display:flex;gap:6px;margin:0 0 10px 40px}
.addkey .inp{flex:1}
.offline-strip{background:var(--navy);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:4px 0;display:flex;gap:8px;justify-content:center;align-items:center}
.dlbar{height:4px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden;width:160px}.dlbar i{display:block;height:100%;background:var(--blue);transition:width .3s}

<script>

h d=\"M11 18h2\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "ext": "<path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"/>", "download": "<path d=\"M12 4v11M7 10l5 5 5-5M5 20h14\"/>", "copy": "<rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a1 1 0 0 1 1-1h10\"/>", "edit": "<path d=\"M4 20h4L19 9l-4-4L4 16z\"/>", "x": "<path d=\"M6 6l12 12M18 6L6 18\"/>", "cpu": "<rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\"/>", "cloud": "<path d=\"M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z\"/>", "eye": "<path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>", "spark": "<path d=\"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6\"/>"};
const ic=(n,s='')=>`<svg class="ico" viewBox="0 0 24 24" style="${s}" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock=()=>new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
let uid=1;const nid=p=>p+(uid++);
const PROV={deepseek:'DeepSeek',openai:'OpenAI',claude:'Claude',other:'Other service'};
const S={
 view:'welcome',wstep:1,source:'online',provider:'deepseek',wkey:{deepseek:'sk-demo-key-0000a1b2',openai:'',claude:'',other:''},wshow:false,wbusy:'',werr:'',safeReady:false,
 firstDone:false,
 chats:[
  {id:'c-w',title:'Weekly update from notes',msgs:[{id:'m-w1',role:'user',text:'Turn these meeting notes into a weekly update.'},{id:'m-w2',role:'bot',full:"Here's your weekly update:\n\nDecided: launch the new pricing page on Nov 3. To do: Maya finishes the FAQ by Friday; Sam sends the customer survey. Open question: do we keep the free plan?",done:true}]},
  {id:'c-s',title:'Summarize this article',msgs:[{id:'m-s1',role:'user',text:'Summarize this article in three sentences.'},{id:'m-s2',role:'bot',full:"The article says remote teams write more but meet less. Teams that keep one shared weekly note report fewer missed deadlines. The author suggests a 15-minute Friday wrap-up.",done:true}]},
  {id:'c-p',title:'Plan a weekend in Portland',msgs:[{id:'m-p1',role:'user',text:'Plan a relaxed weekend in Portland for two.'},{id:'m-p2',role:'bot',full:"Saturday: coffee in the Pearl District, Powell's Books, then the Japanese Garden. Sunday: the farmers market downtown and a walk along the waterfront.",done:true}]}
 ],
 active:null,task:null,curTask:null,modalOpen:false,draft:'',folder:null,
 oldTasks:[{id:'t-old1',title:'Tidy up Downloads',when:'yesterday',sum:'Sorted 42 files into 5 folders. Nothing was deleted.'},{id:'t-old2',title:'Monitor price check',when:'on Monday',sum:'Checked 3 stores. Lowest price: $269 — not below your $250 target yet.'}],
 set:{monthly:'10',perTask:'1',offline:false,def:'deepseek',prov:{deepseek:{st:'on',mask:'sk-…a1b2'},openai:{st:'none'},claude:{st:'none'}},open:null,busy:null,err:'',local:0,sec:'ai'},
 reviewed:false
};
function toast(msg,actLabel,act){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>`+(actLabel?`<a href="#">${actLabel}</a>`:'');
 if(actLabel)el.querySelector('a').onclick=e=>{e.preventDefault();act();el.remove()};
 $('#toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},3600)}
function taskDot(t){return {running:'run',waiting:'wait',stopped:'stop',done:'ok'}[t.status]}
function sidebar(){
 const t=S.task;
 let h=`<aside class="side"><div class="logo">Heybe<span>•</span></div><button class="newbtn" data-act="newchat" title="New chat (⌘K)" style="border:0">${ic('plus')}New chat</button><div class="sec">Chats</div>`;
 S.chats.forEach(c=>{h+=`<div class="item ${S.view==='chat'&&S.active===c.id?'on':''}" tabindex="0" data-chat="${c.id}">${ic('chat')}<span class="grow">${esc(c.title)}</span></div>`});
 h+=`<div class="sec">Tasks</div>`;
 if(t){const pill={running:['Working','#E6F0FB','#1565C0'],waiting:['Needs you','#FFF4DC','#8A5A00'],stopped:['Stopped','#EEF3F9','#5B6575']}[t.status];
  h+=`<div class="item ${S.view==='task'&&S.curTask===t.id?'on':''}" tabindex="0" data-task="${t.id}"><span class="dot ${taskDot(t)}"></span><span class="grow">${esc(t.title)}</span>${pill?`<span class="soon" style="background:${pill[1]};color:${pill[2]}">${pill[0]}</span>`:''}</div>`}
 S.oldTasks.forEach(o=>{h+=`<div class="item ${S.view==='task'&&S.curTask===o.id?'on':''}" tabindex="0" data-task="${o.id}"><span class="dot ok"></span><span class="grow">${o.title}</span></div>`});
 h+=`<div class="foot"><div class="item dim" data-act="memory" title="Coming in v1.1">${ic('brain')}<span class="grow">Memory</span><span class="soon">v1.1</span></div>

 S.view=view;
 if(view==='chat'){if(arg)S.active=arg;if(!S.active||!curChat())newChat(true)}
 if(view==='task')S.curTask=arg||S.curTask;
 strip();
 const b=$('#body');
 if(view==='welcome'){rw();return}

 ({chat:chatView,task:taskView,settings:settingsView})[view]();
