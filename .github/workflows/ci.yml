name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck -S warning -x -P SCRIPTDIR
      - name: shell mock tests
        run: |
          for t in scripts/dev/node-check-mock-test.sh scripts/mirror-mock-test.sh \
                   scripts/poc/fc-agent-mock-test.sh scripts/poc/key-sync-mock-test.sh \
                   scripts/poc/report-table-test.sh scripts/poc/t032-mock-test.sh \
                   scripts/poc/argv-secret-mock-test.sh scripts/poc/net-verify-mock-test.sh \
                   scripts/poc/boxlite-setup-mock-test.sh; do
            echo "== $t"; bash "$t"
          done
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        run: bash scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
